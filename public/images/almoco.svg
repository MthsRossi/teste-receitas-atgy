<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2819"/>
      <stop offset="50%" stop-color="#2D1C10"/>
      <stop offset="100%" stop-color="#1F1209"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE7DB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgWood)"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#180C05" stroke-width="3" opacity="0.4"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#180C05" stroke-width="3" opacity="0.4"/>

  <!-- Trilho de mesa verde-oliva rústico -->
  <rect x="0" y="80" width="800" height="440" fill="#4A5334" opacity="0.25"/>

  <!-- Prato principal de almoço brasileiro com baixo IG -->
  <circle cx="340" cy="300" r="210" fill="url(#plateGrad)" stroke="#C9C2B2" stroke-width="3.5" filter="url(#shadow)"/>
  <circle cx="340" cy="300" r="175" fill="#FAF6EE"/>

  <!-- Filé de peito de frango grelhado suculento dourado -->
  <path d="M 220 230 C 260 170 380 180 410 240 C 430 290 350 330 280 320 C 220 310 190 270 220 230 Z" fill="#D97706" opacity="0.95" filter="url(#shadow)"/>
  <path d="M 230 240 C 270 190 370 195 395 245 C 410 280 340 315 285 310 C 240 300 210 270 230 240 Z" fill="#F59E0B"/>
  <!-- Marcas de grelha rústica -->
  <line x1="260" y1="210" x2="330" y2="280" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="300" y1="210" x2="370" y2="280" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="340" y1="220" x2="390" y2="270" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Purê aveludado de abóbora cabotiá com especiarias -->
  <path d="M 330 310 Q 420 280 450 350 Q 410 430 330 420 Q 280 380 330 310 Z" fill="#EA580C" opacity="0.95"/>
  <path d="M 345 325 Q 410 300 435 355 Q 400 415 340 405 Q 300 375 345 325 Z" fill="#F97316"/>

  <!-- Brócolis frescos cozidos no vapor com azeite -->
  <circle cx="210" cy="340" r="28" fill="#15803d"/>
  <circle cx="225" cy="330" r="22" fill="#16a34a"/>
  <circle cx="200" cy="360" r="24" fill="#166534"/>
  <circle cx="235" cy="365" r="22" fill="#15803d"/>

  <!-- Salada crocante de folhas, tomate cereja e sementes de abóbora -->
  <path d="M 180 220 Q 160 260 190 280 Q 210 240 180 220 Z" fill="#65A30D"/>
  <circle cx="260" cy="360" r="14" fill="#DC2626"/>
  <circle cx="280" cy="375" r="12" fill="#EF4444"/>

  <!-- Selo informativo terracota -->
  <rect x="580" y="210" width="190" height="180" rx="24" fill="#A85A2E" filter="url(#shadow)"/>
  <text x="675" y="265" font-family="'Lora', Georgia, serif" font-size="28" font-weight="bold" fill="#FDFBF7" text-anchor="middle">ALMOÇO</text>
  <text x="675" y="300" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#EDE7DB" text-anchor="middle">PRATO BRASILEIRO</text>
  <text x="675" y="325" font-family="'Inter', sans-serif" font-size="12" fill="#FDFBF7" text-anchor="middle">PROTEÍNA + FIBRAS</text>
  <rect x="615" y="345" width="120" height="24" rx="12" fill="#4A5334"/>
  <text x="675" y="361" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FDFBF7" text-anchor="middle">ZERO PICO GLICÊMICO</text>
</svg>
