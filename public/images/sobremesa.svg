<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382315"/>
      <stop offset="50%" stop-color="#28180E"/>
      <stop offset="100%" stop-color="#190F08"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#E2D9C8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgWarm)"/>

  <!-- Pires de cerâmica terracota -->
  <ellipse cx="340" cy="390" rx="190" ry="85" fill="#A85A2E" opacity="0.9" filter="url(#shadow)"/>
  <ellipse cx="340" cy="385" rx="160" ry="70" fill="#EDE7DB"/>

  <!-- Taça / Tigelinha de vidro com Mousse de cacau 100% ou Maracujá Low Carb -->
  <path d="M 240 220 L 440 220 L 400 370 L 280 370 Z" fill="#451A03" opacity="0.95" filter="url(#shadow)"/>
  <ellipse cx="340" cy="220" rx="100" ry="25" fill="#78350F"/>
  <!-- Creme aveludado de maracujá fresco por cima -->
  <ellipse cx="340" cy="220" rx="80" ry="18" fill="#F59E0B"/>
  <circle cx="320" cy="220" r="4" fill="#292524"/>
  <circle cx="350" cy="225" r="3.5" fill="#292524"/>
  <circle cx="370" cy="216" r="4" fill="#292524"/>

  <!-- Raminho de hortelã fresca decorando -->
  <path d="M 340 205 Q 360 175 380 185 Q 370 205 340 205 Z" fill="#16a34a"/>
  <path d="M 340 205 Q 320 175 305 185 Q 315 205 340 205 Z" fill="#15803d"/>

  <!-- Bolo de cenoura com farinha de amêndoas ao lado -->
  <path d="M 120 300 L 220 250 L 240 370 L 140 420 Z" fill="#D97706" filter="url(#shadow)"/>
  <!-- Calda fina de chocolate 70% -->
  <path d="M 120 300 L 220 250 L 225 270 L 125 320 Z" fill="#291A10"/>

  <!-- Card da Sobremesa -->
  <rect x="570" y="210" width="190" height="180" rx="20" fill="#A85A2E" filter="url(#shadow)"/>
  <text x="665" y="265" font-family="'Lora', Georgia, serif" font-size="26" font-weight="bold" fill="#FDFBF7" text-anchor="middle">SOBREMESAS</text>
  <text x="665" y="298" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#EDE7DB" text-anchor="middle">ZERO AÇÚCAR</text>
  <text x="665" y="325" font-family="'Inter', sans-serif" font-size="12" fill="#FDFBF7" text-anchor="middle">DOCE SEM CULPA</text>
  <rect x="600" y="345" width="130" height="24" rx="12" fill="#4A5334"/>
  <text x="665" y="361" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FDFBF7" text-anchor="middle">ADOÇANTES NATURAIS</text>
</svg>
