<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgNightWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28241E"/>
      <stop offset="50%" stop-color="#1F1B15"/>
      <stop offset="100%" stop-color="#14110D"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#E5DECE"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgNightWood)"/>

  <!-- Pano de prato rústico dobrado à esquerda -->
  <rect x="50" y="80" width="120" height="440" rx="8" fill="#EDE7DB" opacity="0.8" filter="url(#shadow)"/>
  <line x1="80" y1="80" x2="80" y2="520" stroke="#A85A2E" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Tigela de sopa / caldomotivo acolhedor para a noite -->
  <circle cx="360" cy="300" r="190" fill="url(#bowlGrad)" stroke="#C9C2B2" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="360" cy="300" r="150" fill="#EA580C" opacity="0.9"/>
  <!-- Caldo dourado / abóbora com gengibre e frango -->
  <circle cx="360" cy="300" r="140" fill="#F97316"/>

  <!-- Fio de azeite extravirgem em espiral -->
  <path d="M 330 270 Q 370 250 390 280 Q 400 320 360 330 Q 320 330 330 300" fill="none" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>

  <!-- Frango desfiado macio no topo -->
  <path d="M 340 280 Q 360 260 380 275 Q 370 300 340 280 Z" fill="#FEF3C7"/>
  <path d="M 350 290 Q 370 275 390 290 Q 380 310 350 290 Z" fill="#FDE68A"/>

  <!-- Sementes de abóbora e gergelim tostados -->
  <ellipse cx="320" cy="280" rx="5" ry="3" fill="#65A30D" transform="rotate(30 320 280)"/>
  <ellipse cx="370" cy="320" rx="5" ry="3" fill="#65A30D" transform="rotate(-20 370 320)"/>
  <ellipse cx="395" cy="270" rx="4" ry="2.5" fill="#FEF3C7"/>
  <ellipse cx="340" cy="330" rx="4" ry="2.5" fill="#FEF3C7"/>

  <!-- Folhas de salsa fresca e fumaça sutil -->
  <circle cx="375" cy="265" r="4" fill="#15803d"/>
  <circle cx="355" cy="275" r="4" fill="#16a34a"/>

  <!-- Colher de cerâmica ao lado -->
  <path d="M 520 180 Q 560 170 570 220 Q 570 250 540 260 L 590 440 L 570 445 L 525 250 Z" fill="#FAF6EE" stroke="#C9C2B2" stroke-width="2" filter="url(#shadow)"/>

  <!-- Card descritivo -->
  <rect x="580" y="210" width="180" height="180" rx="20" fill="#4A5334" filter="url(#shadow)"/>
  <text x="670" y="265" font-family="'Lora', Georgia, serif" font-size="28" font-weight="bold" fill="#FDFBF7" text-anchor="middle">JANTAR</text>
  <text x="670" y="298" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#EDE7DB" text-anchor="middle">LEVE & NOTURNO</text>
  <text x="670" y="325" font-family="'Inter', sans-serif" font-size="12" fill="#FDFBF7" text-anchor="middle">CALDOS & PROTEÍNA</text>
  <rect x="605" y="345" width="130" height="24" rx="12" fill="#A85A2E"/>
  <text x="670" y="361" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FDFBF7" text-anchor="middle">GLICOSE PLANA ATÉ A MANHÃ</text>
</svg>
