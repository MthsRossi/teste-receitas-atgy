<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgLightWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B2A1D"/>
      <stop offset="50%" stop-color="#2D1E13"/>
      <stop offset="100%" stop-color="#20140A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgLightWood)"/>

  <!-- Balança ou tábua dupla comparativa -->
  <rect x="60" y="80" width="480" height="440" rx="24" fill="#FDFBF7" stroke="#C9C2B2" stroke-width="3" filter="url(#shadow)"/>

  <!-- Lado Esquerdo: "Evite" / Alta carga glicêmica -->
  <rect x="85" y="110" width="205" height="380" rx="16" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <rect x="115" y="130" width="145" height="30" rx="15" fill="#EF4444"/>
  <text x="187" y="150" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">❌ EVITAR / TROCAR</text>
  <text x="187" y="210" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Farinha de Trigo</text>
  <text x="187" y="240" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Açúcar Refinado</text>
  <text x="187" y="270" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Refrigerante / Suco</text>
  <text x="187" y="300" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Arroz Branco Puro</text>
  <text x="187" y="330" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#991B1B" text-anchor="middle">Pão Francês Comum</text>
  <text x="187" y="440" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#B91C1C" text-anchor="middle">Picos de Insulina Rápidos</text>

  <!-- Seta central de troca inteligente -->
  <circle cx="300" cy="300" r="22" fill="#C8913A" filter="url(#shadow)"/>
  <text x="300" y="306" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">➔</text>

  <!-- Lado Direito: "Prefira" / Baixo IG saudável -->
  <rect x="315" y="110" width="205" height="380" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <rect x="115" y="130" width="145" height="30" rx="15" fill="#16A34A" transform="translate(230 0)"/>
  <text x="417" y="150" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✔ SUBSTITUIR POR</text>
  <text x="417" y="210" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">Farinha de Amêndoa/Aveia</text>
  <text x="417" y="240" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">Eritritol / Xilitol</text>
  <text x="417" y="270" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">Água Saborizada / Chá</text>
  <text x="417" y="300" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">Arroz de Couve-Flor / Quinoa</text>
  <text x="417" y="330" font-family="'Lora', serif" font-size="16" font-weight="bold" fill="#166534" text-anchor="middle">Pão de Frigideira Low Carb</text>
  <text x="417" y="440" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">Glicemia Estável & Saciedade</text>

  <!-- Card Lateral Informativo -->
  <rect x="570" y="210" width="190" height="180" rx="20" fill="#4A5334" filter="url(#shadow)"/>
  <text x="665" y="260" font-family="'Lora', Georgia, serif" font-size="22" font-weight="bold" fill="#FDFBF7" text-anchor="middle">SUBSTITUIÇÕES</text>
  <text x="665" y="295" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#EDE7DB" text-anchor="middle">TROCAS INTELIGENTES</text>
  <text x="665" y="325" font-family="'Inter', sans-serif" font-size="12" fill="#FDFBF7" text-anchor="middle">MESMO SABOR, SEM PICO</text>
  <rect x="605" y="345" width="120" height="24" rx="12" fill="#A85A2E"/>
  <text x="665" y="361" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FDFBF7" text-anchor="middle">TABELA COMPLETA</text>
</svg>
