<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#443020"/>
      <stop offset="50%" stop-color="#342315"/>
      <stop offset="100%" stop-color="#24170C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgWood)"/>

  <!-- Tábua de madeira clara brasileira -->
  <rect x="80" y="80" width="460" height="440" rx="20" fill="#D4A373" stroke="#BC6C25" stroke-width="3" filter="url(#shadow)"/>
  <!-- Orifício da tábua -->
  <circle cx="120" cy="120" r="16" fill="#443020"/>

  <!-- Pote de vidro rústico com castanhas, nozes e sementes -->
  <rect x="130" y="240" width="130" height="150" rx="16" fill="#F7F3EC" opacity="0.85" stroke="#C9C2B2" stroke-width="2" filter="url(#shadow)"/>
  <ellipse cx="195" cy="240" rx="65" ry="15" fill="#DDA15E"/>
  <!-- Castanhas dentro -->
  <ellipse cx="180" cy="300" rx="14" ry="9" fill="#B08968" transform="rotate(20 180 300)"/>
  <ellipse cx="205" cy="320" rx="16" ry="10" fill="#9C6644" transform="rotate(-15 205 320)"/>
  <ellipse cx="170" cy="340" rx="12" ry="8" fill="#DDB892"/>
  <ellipse cx="210" cy="280" rx="14" ry="9" fill="#7F4F24"/>

  <!-- Barrinhas artesanais caseiras de sementes e cacau -->
  <rect x="290" y="200" width="180" height="65" rx="10" fill="#582F0E" stroke="#3D200A" stroke-width="2" filter="url(#shadow)"/>
  <rect x="290" y="280" width="180" height="65" rx="10" fill="#7F4F24" stroke="#582F0E" stroke-width="2" filter="url(#shadow)"/>
  <!-- Pontinhos de aveia / sementes nas barrinhas -->
  <ellipse cx="330" cy="225" rx="4" ry="2" fill="#FDE68A"/>
  <ellipse cx="370" cy="235" rx="5" ry="2.5" fill="#FDE68A"/>
  <ellipse cx="420" cy="220" rx="4" ry="2" fill="#FDE68A"/>
  <ellipse cx="350" cy="305" rx="4" ry="2" fill="#FDE68A"/>
  <ellipse cx="400" cy="315" rx="5" ry="2.5" fill="#FDE68A"/>

  <!-- Pão de frigideira fatiado ao lado -->
  <circle cx="340" cy="420" r="45" fill="#FBBF24" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="330" cy="415" r="12" fill="#F59E0B" opacity="0.6"/>

  <!-- Card do Lanche -->
  <rect x="570" y="210" width="190" height="180" rx="20" fill="#C8913A" filter="url(#shadow)"/>
  <text x="665" y="265" font-family="'Lora', Georgia, serif" font-size="28" font-weight="bold" fill="#FDFBF7" text-anchor="middle">LANCHES</text>
  <text x="665" y="298" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#EDE7DB" text-anchor="middle">SACIEDADE PRÁTICA</text>
  <text x="665" y="325" font-family="'Inter', sans-serif" font-size="12" fill="#FDFBF7" text-anchor="middle">BELISQUE SEM CULPA</text>
  <rect x="605" y="345" width="120" height="24" rx="12" fill="#28241E"/>
  <text x="665" y="361" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FDFBF7" text-anchor="middle">FIBRAS & GORDURAS BOAS</text>
</svg>
